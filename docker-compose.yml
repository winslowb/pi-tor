services:
  tor:
    build: ./tor
    image: torserver/tor:latest
    container_name: tor
    network_mode: "host"
    restart: unless-stopped
    environment:
      PI_TOR_UPLINK: "${PI_TOR_UPLINK:-wlan0}"
    volumes:
      - ./tor/torrc:/etc/tor/torrc:ro
      - ./tor/tor-data:/var/lib/tor
      # uplink gate, read-only (see bin/uplink-check.sh). It is deliberately
      # only on this service: pihole and ui must still start when the uplink
      # is broken, so the dashboard can explain why tor is down — a gate on
      # the whole stack would take the UI offline exactly when it is needed.
      - ./bin/uplink-check.sh:/usr/local/bin/uplink-check.sh:ro
    cap_add:
      - NET_ADMIN
    command: >-
      /bin/sh -c
      "chmod 700 /var/lib/tor &&
       chown -R debian-tor:debian-tor /var/lib/tor &&
       /usr/local/bin/uplink-check.sh &&
       exec /usr/bin/tor -f /etc/tor/torrc"
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'tor-resolve example.com 127.0.0.1:9050 >/dev/null 2>&1'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "2" }

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    network_mode: "host"
    restart: unless-stopped
    depends_on: [tor]
    # Pi-hole v6 owns dnsmasq's configuration: the v5 variables (WEBPASSWORD,
    # DNSMASQ_LISTENING, DNS_QUERY_LOGGING, PIHOLE_DNS_*) are ignored, and
    # /etc/dnsmasq.d is no longer read unless FTLCONF_misc_etc_dnsmasq_d=true.
    # That flag stays off on purpose, so these FTLCONF_* keys are the entire
    # DNS policy: listen on the gadget interface only (loopback is implicit in
    # SINGLE), and forward exclusively to tor's DNSPort. An empty or missing
    # upstream list resolves nothing rather than falling back to resolv.conf.
    # Every key set here is read-only in the Pi-hole web UI.
    environment:
      TZ: "${PI_TOR_TZ:-UTC}"
      FTLCONF_webserver_api_password: "${PIHOLE_WEBPASSWORD:-changeme}"
      FTLCONF_dns_listeningMode: "SINGLE"
      FTLCONF_dns_interface: "${PI_TOR_INTERFACE:-usb0}"
      FTLCONF_dns_upstreams: "127.0.0.1#${PI_TOR_DNS_PORT:-5353}"
      FTLCONF_dns_queryLogging: "${PIHOLE_DNS_QUERY_LOGGING:-false}"
      FTLCONF_misc_dnsmasq_lines: "edns-packet-max=${PI_TOR_EDNS_PACKET_MAX:-1232}"
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 40s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "2" }

  ui:
    build: ./ui
    image: pi-tor-ui:latest
    container_name: pi-tor-ui
    network_mode: "host"
    restart: unless-stopped
    depends_on: [tor, pihole]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      PI_TOR_UI_PASSWORD: "${PI_TOR_UI_PASSWORD:-changeme}"
      PI_TOR_UI_PORT: "${PI_TOR_UI_PORT:-8080}"
      PI_TOR_UI_DRY_RUN: "${PI_TOR_UI_DRY_RUN:-0}"
      PI_TOR_PROJECT_DIR: "/project"
    volumes:
      - .:/project
      # root-equivalent access on the host: see ui/README.md
      - /var/run/docker.sock:/var/run/docker.sock
      # host docker binary + cli-plugins for compose recreate operations
      - /usr/bin/docker:/usr/bin/docker:ro
      - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "2" }
