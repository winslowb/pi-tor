# Radxa Zero: g_ether is present and loadable (CONFIG_USB_ETH=m) but nothing
# autoloads it and there is no config.txt overlay, so the gadget here is the
# configfs one `usb-gadget-up` composes. Its re-enumeration is unbind + bind
# the UDC (`usb-gadget-up rebind`), replacing the watchdog default's
# `modprobe -r g_ether && modprobe g_ether`. Quoted: Environment= splits an
# unquoted value on whitespace.
[Service]
Environment="WATCH_RELOAD_CMD=/opt/pi-tor/bin/usb-gadget-up rebind"
