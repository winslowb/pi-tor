# Radxa Zero: there is no g_ether module to reload. Re-enumerating the
# configfs gadget (unbind + bind the UDC) is `usb-gadget-up rebind`, the
# configfs equivalent of the watchdog's default
# `modprobe -r g_ether && modprobe g_ether`. Quoted: Environment= splits an
# unquoted value on whitespace.
[Service]
Environment="WATCH_RELOAD_CMD=/opt/pi-tor/bin/usb-gadget-up rebind"
