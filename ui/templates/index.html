<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pi-tor config</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>pi-tor <span class="accent">config</span></h1>
</header>

<section id="dashboard">
  <h2>Status
    <button id="rules-apply" type="button" class="secondary">Apply firewall rules</button>
    <button id="rules-flush" type="button" class="secondary">Flush firewall rules</button>
    <button id="refresh" type="button" class="secondary">Refresh</button>
  </h2>
  <div id="status" class="cards"><span class="muted">loading…</span></div>
</section>

<section id="uplink">
  <h2>Uplink</h2>
  <div id="uplink-panel" class="muted">loading…</div>
</section>

<section id="config">
  <h2>Configuration</h2>
  <form id="config-form" autocomplete="off"></form>
  <div id="errors" class="errors"></div>
  <div class="actions">
    <button id="preview" type="button">Preview changes</button>
    <button id="apply" type="button">Apply</button>
    <button id="rollback" type="button" class="danger">Rollback last
      backup</button>
  </div>
  <div id="message"></div>
  <div id="diffs"></div>
</section>

<section id="rawfiles">
  <h2>Config files (read-only)</h2>
  <div id="raw"></div>
</section>

<section id="logview">
  <h2>Logs
    <button id="logs-tor" type="button" class="secondary">tor</button>
    <button id="logs-pihole" type="button" class="secondary">pihole</button>
  </h2>
  <pre id="logs" class="muted">dry run: docker logs unavailable</pre>
</section>

<footer>
  <span class="muted">pi-tor config UI · docker-socket access is
  root-equivalent on the host; the HTTP Basic password is the only boundary
  in front of it.</span>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
